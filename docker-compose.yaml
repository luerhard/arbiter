services:
  web:
    build:
      context: .
      target: dev        # use the dev stage above
    env_file: .env
    volumes:
      - .:/app           # hot-reload + editable
    ports:
      - "8000:8000"      # app
      - "5678:5678"      # debugpy
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
