repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict

  # Keep args and version in sync with .github/workflows/formatter.yml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --extend-select, F401, --no-unsafe-fixes, --exit-zero]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --config .prettierrc --write --ignore-unknown
        language: system
        files: \.(html|css|scss|js|json|ya?ml|md)$
