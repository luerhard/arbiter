name: Code Formatting

on:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Ruff Fixes
        uses: astral-sh/ruff-action@v3
        with:
          args: check --fix --extend-select F401 --no-unsafe-fixes --exit-zero

      - name: Run Ruff Formatter
        uses: astral-sh/ruff-action@v3
        with:
          args: format

      - name: Run Prettier
        uses: creD/prettier_action@4.6
        with:
          prettier_options: --config .prettierrc --write **/*.{js,md,html}
          only_changed: True

      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto-commit: fixes by ruff & prettier"
