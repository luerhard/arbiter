name: Code Formatting

on:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Ruff Fixes
        uses: astral-sh/ruff-action@v3
        with:
          args: check --fix --extend-select F401 --no-unsafe-fixes --exit-zero

      - name: Run Ruff Formatter
        uses: astral-sh/ruff-action@v3
        with:
          args: format

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Prettier
        run: npx prettier . --config .prettierrc --write --ignore-unknown

      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto-commit: fixes by ruff & prettier"
