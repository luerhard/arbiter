name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: install poetry + python dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Restore python env if available
        uses: actions/cache@v3
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
      - name: Install the project dependencies
        run: poetry install

      # Setup npm + javascript dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: Restore node_modules if available
        uses: actions/cache@v3
        with:
          path: ./node_modules
          key: node-${{ hashFiles('package-lock.json') }}
      - name: Install Node modules
        run: npm install

      # Build CSS using webpack
      - name: Build CSS assets
        run: npx webpack --config webpack.config.js
        # adjust the command if your build script is different

      - name: setup git credentials for codebook
        run: |
          git config --global user.email "test@test.com"
          git config --global user.name "Test Suite"

      # Run the tests with Poetry
      - name: Run tests
        run: cd core && poetry run pytest
