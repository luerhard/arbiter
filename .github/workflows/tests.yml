name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Docker Compose
        uses: hoverkraft-tech/compose-action@v2.4.3
        with:
          compose-file: ./docker-compose.yaml

      - name: Run tests
        run: SQLITE_FOR_TESTS=1 docker compose run --rm web uv run pytest -q
