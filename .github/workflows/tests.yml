name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Env File
        run: |
          echo "POSTGRES_DB=annotationtool" >> .env
          echo "POSTGRES_USER=test_user" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env

      - name: Run Docker Compose
        uses: hoverkraft-tech/compose-action@v2.4.3
        with:
          compose-file: ./docker-compose.yml

      - name: Run tests
        run: docker compose run --rm web uv run pytest -q
