[project]
authors = [
  {name = "MananCoder29", email = "example@email.com"},
  {name = "Lukas Erhard", email = "luerhard@googlemail.com"},
  {name = "shindenach", email = "example@email.com"},
]
dependencies = [
  "pandas>=2.2,<3.0",
  "django~=5.1",
  "django-widget-tweaks>=1.5.0,<2",
  "django-htmx>=1.18.0,<2",
  "channels[daphne]>=4.1.0,<5",
  "django-colorfield>=0.11.0,<0.12",
  "django-nested-admin>=4.1.1,<5",
  "django-template-partials~=24.4",
  "django-crispy-forms~=2.3",
  "crispy-bootstrap5~=2024.10",
  "gitpython>=3.1.44,<4",
  "django-markdownify>=0.9.5,<0.10",
  "psycopg[binary]>=3.2.10",
  "channels-redis>=4.2.1",
  "django-vite>=3.1.0",
  "django-cotton>=2.1.3",
  "whitenoise>=6.11.0",
  "gunicorn>=25.1.0",
]
description = "The Annotation Tool."
license = "MIT"
name = "annotationtool"
readme = "README.md"
requires-python = ">=3.13,<4.0"
version = "0.0.1"

[dependency-groups]
dev = [
  "django-debug-toolbar>=4.4.2,<5",
  "pytest-django>=4.8.0,<5",
  "pytest>=8.2.2,<9",
  "djlint>=1.34.1,<2",
  "debugpy>=1.8.16",
]
docs = [
  "sphinx>=8.1.3,<9",
  "sphinx-rtd-theme>=3.0.1,<4",
  "sphinx-autodoc-typehints>=2.5.0,<3",
  "myst-parser>=4.0.0,<5",
  "sphinxcontrib-django~=2.5",
]

[tool.uv]
default-groups = [
  "dev",
  "docs",
]

[tool.hatch.build.targets.sdist]
include = ["core"]

[tool.hatch.build.targets.wheel]
include = ["core"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
fix = true
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
line-length = 100
target-version = "py311"
unsafe-fixes = true

[tool.ruff.lint]
ignore = [
  "D107",
  "E712",
  "COM812", # missing trailing comma, conflicts with formatter
  "F401", # unused-import, is re-selected explicitly in gh-actions
  "F841", # remove unused-variables
]
select = [
  "ARG", # flake8-unused-arguments
  "B", # flake8-bugbear
  "C4", #flake8-comprehensions
  "COM", #flake8-commas
  "E", # pycodestyle
  "EM", # flake8-errmsg
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "PT", #flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "Q", # flake8-quotes
  "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/**" = ["E501"]
"core/core/settings/*" = ["F403", "F405"]
"core/tests/**" = ["D", "ARG001"]
"docs/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-local-folder = [
  "annotation",
  "core",
  "data",
  "discuss",
  "projects",
  "users",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.core.settings"
