[tool.poetry]
name = "annotationtool"
version = "0.0.1"
description = "The Annotation Tool."
authors = [
    "MananCoder29 <example@email.com>",
    "Lukas Erhard <luerhard@googlemail.com>",
    "shindenach <example@email.com>",
]
license = "MIT"
readme = "README.md"
packages = [{include = "core"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
django = "^5.1"
django-widget-tweaks = "^1.5.0"
pandas = ">=2.2,<3.0"
django-htmx = "^1.18.0"
daphne = "^4.1.2"
django-channels = "^0.7.0"
channels = "^4.1.0"

[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "^4.4.2"
libsass = "^0.23.0"
django-compressor = "^4.5.1"
django-sass-processor = "^1.4.1"
pytest-django = "^4.8.0"
pytest = "^8.2.2"
djlint = "^1.34.1"

[tool.ruff]
fix = true
unsafe-fixes = true
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
"ARG", # flake8-unused-arguments
"B", # flake8-bugbear
"C4", #flake8-comprehensions
"COM", #flake8-commas
"E", # pycodestyle
"EM", # flake8-errmsg
"F", # pyflakes
"I", # isort
"N", # pep8-naming
"PT", #flake8-pytest-style
"PTH", # flake8-use-pathlib
"Q", # flake8-quotes
"UP", # pyupgrade
]
ignore = [
  "D107",
  "E712",
  "COM812", # missing trailing comma, conflicts with formatter
  "F401", # unused-import, is re-selected explicitly in gh-actions
  "F841", # remove unused-variables
]

[tool.ruff.lint.per-file-ignores]
"core/core/settings/*" = ["F403", "F405"]
"**/migrations/**" = ["E501"]
"docs/**" = ["D"]
"core/tests/**" = ["D", "ARG001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-local-folder = ["core", "annotation", "users"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.core.settings"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
