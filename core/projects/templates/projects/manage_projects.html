{% extends "base.html" %}
{% block content %}
    <table class="table">
        <thead>
            <tr>
                <th>Project</th>
                <th>Meta</th>
            </tr>
        </thead>
        <tbody>
            {% for project in projects %}
                <tr>
                    <td>
                        <a href="{% url 'manage-project-detail' project.pk %}">{{ project.name }}</a>
                    </td>
                    <td>Meta</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock content %}
