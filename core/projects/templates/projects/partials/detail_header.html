<div class="card">
    <div class="card-header">
        <h2 class="font-weight-bolder">{{ project.name }}</h2>
    </div>
    <div class="card-body">
        <span class="font-weight-bolder text-sm">Annotators</span>
        <ul class="list-item-group px-3">
            {% for user in annotators %}<li class="list-group-item border-0 p-0 text-muted">{{ user.username }}</li>{% endfor %}
        </ul>
        <span class="font-weight-bolder text-sm">Experts</span>
        <ul class="list-item-group px-3">
            {% for user in experts %}<li class="list-group-item border-0 p-0 text-muted">{{ user.username }}</li>{% endfor %}
        </ul>
    </div>
</div>
