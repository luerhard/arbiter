<div class="container">
    <div class="d-flex justify-content-center">
        <h1>Project: {{ project.name }}</h1>
    </div>
    <table class="table simple-info-table">
        <thead>
            <tr>
                <th>Annotators</th>
            </tr>
        </thead>
        <tbody>
            {% for user in annotators %}
                <tr>
                    <td>{{ user.username }}</td>
                </tr>
            {% endfor %}
        </tbody>
        <thead>
            <tr>
                <th>Experts</th>
            </tr>
        </thead>
        <tbody>
            {% for user in experts %}
                <tr>
                    <td>{{ user.username }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
