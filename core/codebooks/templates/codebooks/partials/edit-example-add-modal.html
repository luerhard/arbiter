{% load crispy_forms_tags %}
<div class="modal-dialog modal-dialog-centered" id="add-example">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">
                {% if form.action == "add" %}
                    Add Example
                {% else %}
                    Edit Example
                {% endif %}
            </h5>
        </div>
        <div class="modal-body">{% crispy form %}</div>
        <div class="modal-footer">
            <button tabindex="99"
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">Close</button>
            <button type="submit"
                    form="{{ form.helper.form_id }}"
                    class="btn btn-primary close-dialog">Save</button>
        </div>
    </div>
</div>
