{% load widget_tweaks %}
<form hx-post="{% url 'codebook-sort-examples' %}"
      id="example_list_{{ definition.pk }}"
      hx-trigger="end"
      hx-swap="outerHTML">
    <input type="hidden" name="definition_id" value="{{ definition.pk }}">
    <div class="sortable list-group">
        {% for example in definition.examples.all %}
            <li class="list-group-item">
                <input type="hidden" name="example_order" value="{{ example.pk }}">
                <div class="d-flex justify-content-between">
                    <span class="text-muted">#{{ definition.identifier }}:{{ example.identifier }}</span>
                    <div class="px-2">
                        <i class="bi bi-arrows-move h5 handle" role="button"></i>
                        <button hx-get="{% url 'codebook-delete-example' definition_id=definition.id example_id=example.id %}"
                                hx-target="#add-example"
                                hx-trigger="click"
                                data-bs-toggle="modal"
                                data-bs-target="#modal-container"
                                class="btn">
                            <i class="bi bi-pencil h5"></i>
                        </button>
                        <a hx-delete="{% url 'codebook-delete-example' definition_id=definition.id example_id=example.id %}"
                           hx-target="#example_list_{{ definition.pk }}"
                           hx-confirm="Are you sure?"
                           role="button"><i class="bi bi-x-circle h5"></i></a>
                    </div>
                </div>
                <div class="d-flex justify-content-start fw-bold h6">Example {{ example.order }}:&nbsp;{{ example.example }}</div>
                {% if example.comment %}<div class="d-flex small">{{ example.comment }}</div>{% endif %}
            </li>
        {% endfor %}
        <li class="list-group-item">
            <div class="d-flex justify-content-end my-2">
                <button hx-get="{% url 'codebook-add-example' definition_id=definition.id %}"
                        hx-target="#add-example"
                        hx-trigger="click"
                        data-bs-toggle="modal"
                        data-bs-target="#modal-container"
                        class="btn">
                    <i class="bi bi-plus-square h4"></i>
                </button>
            </div>
        </li>
    </div>
</form>
