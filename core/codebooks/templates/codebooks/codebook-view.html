{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col mt-4">
        <div class="card">
            <div class="card-header border-bottom-0">
                <div class="d-flex justify-content-center">
                    <h2 class="fw-bold">{{ codebook_name }}</h2>
                </div>
            </div>
            <div class="card-body">
                <div class="card">
                    <div class="card-body m-3">
                        <div class="row">
                            <div class="col-8 col-md-4">
                                <dl>
                                    <div class="d-flex justify-content-between">
                                        <dt class="fw-bold text-nowrap">Project</dt>
                                        <dd class="text-start">
                                            {{ project_name }}
                                        </dd>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <dt class="fw-bold text-nowrap">Version Name</dt>
                                        <dd class="text-start">
                                            {{ version_name }}
                                        </dd>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <dt class="fw-bold text-nowrap">Date</dt>
                                        <dd class="text-start">
                                            {{ date }}
                                        </dd>
                                    </div>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                {% for field in fields %}
                    <div>
                        {{ field.codename }}
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
