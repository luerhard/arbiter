{# Progress in the top bar. Re-sent out-of-band with each panel swap (see panel.html). #}
<div
  id="annotation-progress"
  class="flex flex-1 items-center gap-3"
  data-phase="A"
  {% if oob %}hx-swap-oob="true"
  {% endif %}
>
  <div class="progress flex-1">
    <div class="progress-bar" style="width: {% widthratio progress.done progress.total 100 %}%"></div>
  </div>
  <span class="font-mono text-[13px] whitespace-nowrap text-ink-2"
    >{{ progress.done }}
    /
    {{ progress.total }}
    done</span
  >
</div>
