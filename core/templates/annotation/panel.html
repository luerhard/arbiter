{% load custom_tags %}
<div id="annotation-panel"
     class="divide-y divide-gray-200 overflow-hidden rounded-lg bg-white shadow-sm dark:divide-white/10 dark:bg-gray-800/50 dark:shadow-none dark:outline dark:-outline-offset-1 dark:outline-white/10">
    <!--progress bar-->
    <div class="px-4 py-5 sm:px-6">
        <c-progressbar percent="{% widthratio progress.done progress.total 100 %}">{{ progress.done }} / {{ progress.total }}</c-progressbar>
    </div>
    <!-- example -->
    <div class="px-4 py-5 sm:p-6">
        <div class="dark:text-white">{{ example.content }}</div>
    </div>
    <!-- labels -->
    <div class="px-4 py-4 sm:px-6">
        <form id="label-form"
              method="post"
              hx-post="{% url 'annotate-assignment' batch.id assignment_id %}"
              hx-target="#annotation-panel"
              hx-swap="outerHTML">
            {% csrf_token %}
            <div class="flex flex-wrap items-start gap-3" role="group">
                {% for checkbox, detail in label_form.labels|zip_lists:label_form.label_details %}
                    <c-label id="{{ checkbox.id_for_label }}" value="{{ checkbox.data.value }}" text="{{ checkbox.choice_label }}" color="{{ detail.color }}" hotkey="{{ detail.hotkey }}" :checked="detail.selected" />
                {% endfor %}
            </div>
        </form>
    </div>
    <!-- nav panel-->
    <div class="px-4 py-4 sm:px-6">
        <div id="nav-buttons"
             x-data="navBlock({ hasPrev: {{ has_prev|yesno:'true,false' }}, hasNext: {{ has_next|yesno:'true,false' }} })"
             class="mt-5 flex items-center justify-center gap-3">
            <!-- Prev -->
            <button x-ref="prev"
                    hx-get="{{ prev_url }}"
                    hx-target="#annotation-panel"
                    hx-swap="outerHTML"
                    hx-push-url="true"
                    :disabled="!hasPrev || busy"
                    class="min-w-[2.5rem] rounded border px-3 py-2 text-sm enabled:bg-gray-50 enabled:hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed border-gray-300 text-gray-800"
                    aria-label="Previous (←)">
                <i class="bi bi-arrow-left"></i>
            </button>
            <!-- Save -->
            <button :disabled="busy"
                    type="submit"
                    form="label-form"
                    class="rounded px-4 py-2 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed text-white"
                    :class="{'bg-blue-600 hover:bg-blue-700': !busy, 'bg-blue-400': busy}">
                <span x-show="!busy">Save</span>
                <span x-show="busy" class="inline-flex items-center gap-2">
                    <svg class="h-4 w-4 animate-spin"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor">
                        <circle cx="12" cy="12" r="9" stroke-width="2" opacity=".25"></circle>
                        <path d="M21 12a9 9 0 0 1-9 9" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                    Saving…
                </span>
            </button>
            <!-- Next -->
            <button x-ref="next"
                    hx-get="{{ next_url }}"
                    hx-target="#annotation-panel"
                    hx-swap="outerHTML"
                    hx-push-url="true"
                    :disabled="!hasNext || busy"
                    class="min-w-[2.5rem] rounded border px-3 py-2 text-sm enabled:bg-gray-50 enabled:hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed border-gray-300 text-gray-800"
                    aria-label="Next (→)">
                <i class="bi bi-arrow-right"></i>
            </button>
        </div>
    </div>
</div>
