<div class="label-row grid grid-cols-[1fr_110px] gap-3 @xl:grid-cols-[1fr_200px_110px]">
  {# narrow: the name on its own line, color and key below #}
  <div class="col-span-2 @xl:col-span-1">
    <label class="field-label" for="label-name-{{ index }}">Label</label>
    <input
      id="label-name-{{ index }}"
      name="label_name"
      type="text"
      class="input"
      placeholder="e.g. Offensive"
      value="{{ row.name|default:'' }}"
    />
  </div>
  <div>
    <label class="field-label" for="label-color-{{ index }}">Color</label>
    <input
      id="label-color-{{ index }}"
      name="label_color"
      value="{{ row.color|default:'' }}"
      type="text"
      class="input"
      placeholder="#155596"
      data-coloris
    />
  </div>
  <div>
    <label class="field-label" for="label-hotkey-{{ index }}">Key</label>
    <input
      id="label-hotkey-{{ index }}"
      name="label_hotkey"
      value="{{ row.hotkey|default:'' }}"
      type="text"
      maxlength="1"
      class="input font-mono"
      placeholder="1"
    />
  </div>
</div>
