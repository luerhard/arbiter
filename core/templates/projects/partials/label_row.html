<div class="label-row grid grid-cols-1 gap-3 sm:grid-cols-3">
  <div>
    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300" for="label-name-{{ index }}">Label</label>
    <input
      id="label-name-{{ index }}"
      name="label_name"
      type="text"
      class="mt-1 block w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 dark:border-white/10 dark:bg-gray-900 dark:text-white"
      placeholder="e.g. Positive"
    />
  </div>
  <div>
    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300" for="label-color-{{ index }}"
      >Color</label
    >
    <input
      id="label-color-{{ index }}"
      name="label_color"
      type="text"
      class="mt-1 block w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 dark:border-white/10 dark:bg-gray-900 dark:text-white"
      placeholder="#2c3e50"
      data-coloris
    />
  </div>
  <div>
    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300" for="label-hotkey-{{ index }}"
      >Hotkey</label
    >
    <input
      id="label-hotkey-{{ index }}"
      name="label_hotkey"
      type="text"
      maxlength="1"
      class="mt-1 block w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 dark:border-white/10 dark:bg-gray-900 dark:text-white"
      placeholder="A"
    />
  </div>
</div>
