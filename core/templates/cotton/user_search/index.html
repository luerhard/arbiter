<c-vars name="" search_url="" selected_users="[]" placeholder="" />
<div
  x-data="window.lib.ui.userPicker('{{ name }}', {{ selected_users }})"
  class="flex flex-col gap-2.5"
  @click.outside="open = false"
>
  <div
    class="relative"
    x-ref="searchArea"
    @focusout="$nextTick(() => { if (!$refs.searchArea.contains(document.activeElement)) open = false })"
  >
    {% heroicon_micro "magnifying-glass" class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-ink-3" %}
    <input
      type="text"
      x-ref="searchInput"
      x-model="query"
      @focus="open = true"
      @input="open = true"
      placeholder="{{ placeholder|default:'Search users' }}"
      aria-label="{{ placeholder|default:'Search users' }}"
      class="input pl-9"
      hx-get="{{ search_url }}"
      hx-trigger="focus, input changed delay:200ms"
      hx-target="#{{ name }}-results"
      hx-swap="innerHTML"
      hx-vals='js:{ q: this.value, field: "{{ name }}" }'
    />
    <div
      id="{{ name }}-results"
      x-show="open"
      x-cloak
      class="absolute z-10 mt-1 max-h-56 w-full overflow-auto rounded-[10px] border border-line bg-surface p-1 shadow-[0_12px_32px_rgb(11_13_16/0.14)]"
    ></div>
  </div>
  <div class="flex flex-wrap gap-1.5">
    <template x-for="u in selectedUsers" :key="u.id">
      <span class="inline-flex h-7 items-center gap-1.5 rounded-full bg-subtle pr-1 pl-3 text-[13px] text-ink">
        <span x-text="u.username"></span>
        <button
          type="button"
          @click="remove(u.id)"
          class="inline-flex size-5 cursor-pointer items-center justify-center rounded-full text-ink-3 hover:bg-line hover:text-ink"
          :aria-label="'Remove ' + u.username"
        >
          {% heroicon_micro "x-mark" class="size-3" %}
        </button>
      </span>
    </template>
  </div>
  <template x-for="u in selectedUsers" :key="u.id">
    <input type="hidden" :name="name" :value="u.id" />
  </template>
</div>
