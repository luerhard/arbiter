{% for user in users %}
<button
  type="button"
  class="menu-item"
  onclick="
    const root = this.closest('[x-data]');
    if (!root || !window.Alpine) return;
    const data = window.Alpine.$data(root);
    if (data && typeof data.add === 'function') {
      data.add({ id: {{ user.id }}, username: '{{ user.username|escapejs }}' });
    }
  "
>
  {{ user.username }}
</button>
{% empty %}
<div class="px-2.5 py-2 text-[13px] text-ink-3">No matches</div>
{% endfor %}
