{% comment %}
Swapped by htmx into the picker's results list, inside its Alpine component (cotton/user_search/index.html), so add() is
in scope.
{% endcomment %}
{% for user in users %}
<button type="button" class="menu-item" @click="add({ id: {{ user.id }}, username: '{{ user.username|escapejs }}' })">
  {{ user.username }}
</button>
{% empty %}
<div class="px-2.5 py-2 text-meta text-ink-3">No matches</div>
{% endfor %}
