<!-- Live Notification Area -->
<div aria-live="assertive"
     class="pointer-events-none fixed inset-0 flex items-end px-4 py-6 sm:items-start sm:p-6">
    <div id="notification-area"
         class="flex w-full flex-col items-center space-y-4 sm:items-end">
        <!-- Notification panel, dynamically insert notification into the live region when it needs to be displayed -->
    </div>
</div>
<!-- Notification Template -->
<template id="notification">
    <div x-data="notification"
         x-ref="renderedNotification"
         class=" overflow-hidden pointer-events-auto w-full max-w-sm translate-y-0 transform rounded-lg bg-white opacity-100 shadow-lg outline-1 outline-black/5 transition duration-300 ease-out sm:translate-x-0 dark:bg-gray-800 dark:-outline-offset-1 dark:outline-white/10 starting:translate-y-2 starting:opacity-0 starting:sm:translate-x-2 starting:sm:translate-y-0">
        <div class="p-4">
            <div class="flex items-start">
                <div id="notifyIcon" class="shrink-0"></div>
                <div class="ml-3 w-0 flex-1 pt-0.5">
                    <p id="notifyHead"
                       class="text-sm font-medium text-gray-900 dark:text-white"></p>
                    <!-- <p id="notifyBody" class="mt-1 text-sm text-gray-500 dark:text-gray-400">Anyone with a link can now view this file.</p> -->
                </div>
                <div class="ml-4 flex shrink-0">
                    <button type="button"
                            class="inline-flex rounded-md text-gray-400 hover:text-gray-500 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-600 dark:hover:text-white dark:focus:outline-indigo-500"
                            @click="clear()">
                        <span class="sr-only">Close</span>
                        <svg viewBox="0 0 20 20"
                             fill="currentColor"
                             data-slot="icon"
                             aria-hidden="true"
                             class="size-5">
                            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="h-1 w-full bg-indigo-500 transition-transform duration-3000 ease-linear translate-x-0 starting:translate-x-[-100%]">
        </div>
    </div>
</template>
<!-- SVG Templates -->
<c-expert.check-circle />
<c-expert.x-circle />
<c-expert.arrow-up-circle />
