<c-vars annotations_by_user empty_text="No labels assigned." />
{% if annotations_by_user %}
<div class="grid grid-cols-[130px_1fr] items-center gap-x-4 gap-y-2.5">
  {% for user, annotations in annotations_by_user.items %}
  <span class="truncate text-ink-2">{{ user }}</span>
  <div class="flex flex-wrap gap-1.5">
    {% for annotation in annotations %}
    <span class="label-tag" style="--label-color: {{ annotation.label.color }}">{{ annotation.label.name }}</span>
    {% empty %}
    <span class="text-[13px] text-ink-3">No labels</span>
    {% endfor %}
  </div>
  {% endfor %}
</div>
{% else %}
<p class="text-[13px] text-ink-3">{{ empty_text }}</p>
{% endif %}
