<div x-data class="flex flex-col gap-3">
  <template x-for="message in $store.chat.messages" :key="message.id">
    <div
      :id="'message-' + message.id"
      x-init="if ($el.id === ('message-' + $store.chat.last_render_id)) scrollToBottom()"
    >
      <!-- Current user -->
      <template x-if="message.user === $store.user_self">
        <div class="ml-auto flex max-w-[85%] flex-col items-end gap-1">
          <span class="text-xs text-ink-3">You</span>
          <p
            class="rounded-[14px] rounded-br-[4px] bg-accent-soft px-3.5 py-2.5 leading-normal text-ink"
            x-text="message.text"
          ></p>
        </div>
      </template>
      <!-- Other users -->
      <template x-if="message.user !== $store.user_self && message.user !== 'system'">
        <div class="flex max-w-[85%] flex-col items-start gap-1">
          <span class="text-xs text-ink-3" x-text="message.user"></span>
          <p
            class="rounded-[14px] rounded-bl-[4px] border border-line bg-surface px-3.5 py-2.5 leading-normal text-ink"
            x-text="message.text"
          ></p>
        </div>
      </template>
      <!-- System -->
      <template x-if="message.user === 'system'">
        <div class="flex justify-center">
          <span class="rounded-full bg-subtle px-2.5 py-1 text-xs text-ink-3" x-text="message.text"></span>
        </div>
      </template>
    </div>
  </template>
</div>
