<div x-data id="progressbar" class="w-full rounded-full bg-gray-200 dark:bg-gray-700">
    <div class="bg-blue-600 text-xs font-medium text-blue-100 text-center p-0.5 leading-none rounded-full overflow-x-visible"
         x-text="$store.progress.done + '/' + $store.progress.total"
         style="min-width: 10%;"
         :style="{ width: $store.progress.ratio + '%' }">
    </div>
</div>
