<div x-data id="progressbar" class="flex flex-1 items-center gap-3" data-phase="D">
  <div class="progress flex-1 max-sm:hidden">
    <div class="progress-bar" :style="{ width: $store.progress.ratio + '%' }"></div>
  </div>
  <span
    class="font-mono text-meta whitespace-nowrap text-ink-2"
    x-text="$store.progress.total ? `${$store.progress.done} / ${$store.progress.total} discussed` : ''"
  ></span>
</div>
