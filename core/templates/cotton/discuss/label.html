<!-- Real checkbox for Django; visually hidden but stays in the form -->
<div x-data
     x-init="$watch('$store.labels', (newValue, oldValue) => { console.log('--- Alpine Store labels changed ---'); console.log('Old value:', JSON.stringify(oldValue)); console.log('New value:', JSON.stringify(newValue)); })"
     class="flex flex-wrap gap-2">
    <template x-for="label in $store.labels">
        <div id="prev-labels">
            <input type="checkbox"
                   name="labels"
                   class="sr-only"
                   :id="'label-' + label.id" />
            <label :for="'label-' + label.id"
                   x-text="label.label"
                   class="cursor-pointer rounded-2xl border px-3 py-2 text-sm transition bg-white text-gray-800 hover:bg-gray-50 border-gray-300 shadow-sm">
            </label>
        </div>
    </template>
</div>
