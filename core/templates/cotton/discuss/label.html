<c-vars id text color checked />
<div class="inline-block"
     x-data="">
    <!-- Real checkbox for Django; visually hidden but stays in the form -->
    <input type="checkbox"
           name="labels"
           class="sr-only"
           :id="id"
           x-model="isChecked" />
    <!-- Tailwind-styled pill -->
    <label ::for="id"
           class="select-none cursor-pointer rounded-2xl border px-3 py-2 text-sm transition data-[active=true]:bg-[var(--label-color)] data-[active=true]:text-[var(--label-text)] data-[active=false]:bg-white data-[active=false]:text-gray-800 data-[active=false]:hover:bg-gray-50 border-gray-300 shadow-sm"
           :style="`--label-color: {{ color }}; --label-text: ${textColor()};`"
           :data-active="String(isChecked)"
           @click.prevent="toggle()"
           @keydown.enter.prevent="toggle()">
    </label>
</div>
