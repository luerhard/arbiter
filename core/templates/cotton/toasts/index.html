<div data-toast-container aria-live="polite" class="toast-stack">
  <div data-toast-stack class="contents">
    <div data-toast-template class="toast hidden" role="status">
      <div data-toast-icon class="contents"></div>
      <p data-toast-body class="flex-1 pt-px font-medium"></p>
      <button type="button" data-toast-close class="toast-close" aria-label="Close">
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
    {{ slot }}
  </div>
</div>
