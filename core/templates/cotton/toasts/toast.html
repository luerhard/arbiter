<div data-toast data-toast-tags="{{ tags }}" class="toast" role="status">
  {% include "cotton/toasts/icons.html" %}
  <p data-toast-body class="flex-1 pt-px font-medium">{{ message }}</p>
  <button type="button" data-toast-close class="toast-close" aria-label="Close">
    {% heroicon_micro "x-mark" class="size-4" %}
  </button>
</div>
