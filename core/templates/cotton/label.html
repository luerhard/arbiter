<c-vars id value text color hotkey checked disabled variant />
<div class="inline-block" x-data="labelButton({ id: '{{ id }}', hotkey: '{{ hotkey|default:'' }}', disabled:
    {% if disabled is True or variant == 'disabled' %}
        true
    {% else %}
        false
    {% endif %}
    })">
    <!-- Real checkbox for Django; visually hidden but stays in the form -->
    <input type="checkbox"
           name="labels"
           class="sr-only label-input"
           id="{{ id }}"
           value="{{ value }}"
           {% if disabled is True or variant == 'disabled' %}disabled{% endif %}
           {% if checked %}checked{% endif %}
           x-ref="input" />
    <!-- Tailwind-styled pill -->
    <label for="{{ id }}"
           class="label"
           style="--label-color: {{ color|default:'#3b82f6' }};
                  --label-text: #ffffff">
        <i class="bi bi-check check-icon"></i>
        <span class="label-content">
            {{ text }}
            <template x-if="hotkey">
                <span class="label-hotkey" x-text="`(${hotkey})`"></span>
            </template>
        </span>
    </label>
</div>
