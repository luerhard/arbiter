<c-vars id value text color hotkey model :checked="false" :disabled="false" name="labels" variant="django" />
<div
  class="inline-block"
  x-data='labelButton({ id: "{{ id|default:""|escapejs }}", hotkey: "{{ hotkey|default:""|escapejs }}", disabled: {% if variant == "alpine" %}{{ disabled|default:"false" }}{% else %}{{ disabled|yesno:"true,false" }}{% endif %} })'
>
  <!-- Real checkbox for Django; visually hidden but stays in the form -->
  {% if variant == "django" %}
  <input
    type="checkbox"
    name="{{ name|default:'labels' }}"
    class="sr-only label-input"
    id="{{ id }}"
    value="{{ value }}"
    {% if checked|yesno:"true,false" == "true" %}checked{% endif %}
    {% if disabled|yesno:"true,false" == "true" %}disabled{% endif %}
    x-ref="input"
  />
  <label for="{{ id }}" class="label" style="--label-color: {{ color|default:'#3b82f6' }}; --label-text: #ffffff">
    {% heroicon_micro "check" class="check-icon" %}
    <span class="label-content">
      <span>{{ text }}</span>
      {% if hotkey %}<span class="label-hotkey">{{ hotkey }}</span>{% endif %}
    </span>
  </label>
  {% elif variant == "alpine" %}
  <input
    type="checkbox"
    name="{{ name|default:'labels' }}"
    class="sr-only label-input"
    :id="{{ id }}"
    :value="{{ value }}"
    :disabled="{{ disabled }}"
    {% if model %}
    x-model="{{ model }}"
    {% else %}
    :checked="{{ checked }}"
    {% endif %}
    x-ref="input"
  />
  <label :for="{{ id }}" class="label" :style="{ '--label-color': {{ color }}, '--label-text': '#ffffff' }">
    {% heroicon_micro "check" class="check-icon" %}
    <span class="label-content">
      <span x-text="{{ text }}"></span>
      <template x-if="typeof hotkey !== 'undefined' && hotkey">
        <span class="label-hotkey" x-text="hotkey"></span>
      </template>
    </span>
  </label>
  {% endif %}
</div>
