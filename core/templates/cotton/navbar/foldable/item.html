<div class="group relative flex items-center gap-x-6 rounded-lg p-4 text-sm/6 hover:bg-gray-50 dark:hover:bg-white/5">
  <div
    class="flex size-11 flex-none items-center justify-center rounded-lg bg-gray-50 group-hover:bg-white dark:bg-gray-700/50 dark:group-hover:bg-gray-700"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      data-slot="icon"
      aria-hidden="true"
      class="size-6 text-gray-600 group-hover:text-indigo-600 dark:text-gray-400 dark:group-hover:text-white"
    >
      <path d="M10.5 6a7.5 7.5 0 1 0 7.5 7.5h-7.5V6Z" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13.5 10.5H21A7.5 7.5 0 0 0 13.5 3v7.5Z" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <div class="flex-auto">
    <a href="{{ url }}" class="block font-semibold text-gray-900 dark:text-white">
      {{ slot }}
      <span class="absolute inset-0"></span>
    </a>
    <p class="mt-1 text-gray-600 dark:text-gray-400">{{ description }}</p>
  </div>
</div>
