<!-- prettier-ignore -->
<c-vars href="/" type="link" variant="primary" :variants="{'primary': 'rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900', 'secondary': 'rounded-lg border border-indigo-300 bg-white px-3 py-1.5 text-sm font-medium text-indigo-700 shadow-sm hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:border-indigo-600 dark:bg-gray-800 dark:text-indigo-300 dark:hover:bg-gray-700 dark:focus:ring-offset-gray-900' }" />
{% if type == "link" %}
<a href="{{ href }}" class="{{ variants|get_item:variant }}">{{ slot }}</a>
{% elif type == "button" %}
<button type="submit" class="{{ variants|get_item:variant }}">{{ slot }}</button>
{% endif %}
