<c-vars variant="link" href />
{% if variant == "link" %}
<a
  href="{{ href }}"
  {{ attrs }}
  class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
>
  {{ slot }}
</a>
{% elif variant == "button" %}
<button
  {{ args }}
  class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
  {{ attrs }}
>
  {{ slot }}
</button>
{% endif %}
