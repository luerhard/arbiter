{% for notification in notifications %}
<div data-notification-id="{{ notification.id }}" class="toast" data-variant="info" role="status">
  {% heroicon_outline "bell" class="toast-icon" %}
  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <p class="font-medium">{{ notification.message }}</p>
    {% if notification.batch %}
    <a href="{% url 'project-detail' notification.batch.project_id %}" class="link text-meta">Open project</a>
    {% endif %}
  </div>
  <button
    type="button"
    hx-post="{% url 'notification-read' notification.id %}"
    hx-target="closest [data-notification-id]"
    hx-swap="delete"
    class="toast-close"
    aria-label="Mark as read"
    title="Mark as read"
  >
    {% heroicon_micro "x-mark" class="size-4" %}
  </button>
</div>
{% endfor %}
{% if more %}
<div id="notifications-more" class="toast items-center" data-variant="info" role="status">
  <p class="flex-1 text-meta text-ink-2">
    +
    {{ more }}
    more notification{{ more|pluralize }}
  </p>
  <button type="button" hx-post="{% url 'notifications-read-all' %}" hx-swap="none" class="link text-meta font-medium">
    Mark all as read
  </button>
</div>
{% endif %}
