{% for notification in notifications %}
<div data-notification-id="{{ notification.id }}" class="toast" data-variant="info" role="status">
  <svg
    class="toast-icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M12 3a6 6 0 0 0-6 6c0 5-2 6.5-2 6.5h16S18 14 18 9a6 6 0 0 0-6-6z" />
    <path d="M10.3 19a1.9 1.9 0 0 0 3.4 0" />
  </svg>
  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <p class="font-medium">{{ notification.message }}</p>
    {% if notification.batch %}
    <a href="{% url 'project-detail' notification.batch.project_id %}" class="link text-[13px]">Open project</a>
    {% endif %}
  </div>
  <button
    type="button"
    hx-post="{% url 'notification-read' notification.id %}"
    hx-target="closest [data-notification-id]"
    hx-swap="delete"
    class="toast-close"
    aria-label="Mark as read"
    title="Mark as read"
  >
    <svg
      class="size-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
  </button>
</div>
{% endfor %}
