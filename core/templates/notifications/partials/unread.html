{% for notification in notifications %}
<div
  data-notification-id="{{ notification.id }}"
  class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-lg bg-indigo-50 text-indigo-900 shadow-lg outline-1 outline-indigo-900/10 dark:bg-indigo-900/30 dark:text-indigo-100 dark:outline-indigo-500/20"
>
  <div class="p-4">
    <div class="flex items-start">
      <div class="shrink-0">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
          class="size-6 text-indigo-400"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m15 11.25-3-3m0 0-3 3m3-3v7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
          />
        </svg>
      </div>
      <div class="ml-3 w-0 flex-1 pt-0.5">
        <p class="text-sm font-medium">{{ notification.message }}</p>
      </div>
      <div class="ml-4 flex shrink-0">
        <button
          type="button"
          hx-post="{% url 'notification-read' notification.id %}"
          hx-target="closest [data-notification-id]"
          hx-swap="delete"
          class="inline-flex cursor-pointer rounded-md text-indigo-400 hover:text-indigo-500 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-600 dark:hover:text-indigo-200 dark:focus:outline-indigo-500"
        >
          <span class="sr-only">Mark as read</span>
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5">
            <path
              d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
{% endfor %}
