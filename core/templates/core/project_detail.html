{% extends 'base.html' %}

{% block content %}


<div class="card">
    <div class="card-body">
        <div class="row">
            <h1>Project: {{ project.name }}</h1>
        </div>

        <div clas="row">

        </div>

        <div class="row">
            <table class="table">
                <tr>
                    <th>Annotators</th>
                </tr>
                {% for user in annotators %}
                <tr>
                    <td>{{ user }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>

        <div class="row">
            <table class="table">
                <tr>
                    <th>Experts</th>
                </tr>
                {% for user in experts.all %}
                <tr>
                    <td>{{ user.username }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
        <div class="row">
            <table class="table">
                <tr>
                    <th>Batches</th>
                </tr>
                {% for user in batches.all %}
                <tr>
                    <td>{{ user.username }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>

    </div>
</div>

{% endblock %}
