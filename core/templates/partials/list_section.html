<!-- templates/partials/list_section.html -->
<section id="list-section" class="list-service-sec pt-5 pb-5">
    <div class="container">
        <div class="row">
            <div class="section-header text-center">
                <h2 class="fw-bold fs-1">
                    Our
                    <span class="b-class-secondary">{{ title }}</span>
                </h2>
            </div>
        </div>
        <div class="row mt-5 mt-md-4 row-cols-1 row-cols-sm-1 row-cols-md-3 justify-content-center grid">
            {% for item in items %}
                <div class="col">
                    <div class="service-card">
                        <h3>{{ item.name }}</h3>
                        <p>{{ item.description }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
