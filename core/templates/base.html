<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="keywords"
              content="annotation label labeling text sentence collaborative" />
        <meta name="description" content="Text Annotation Tool">
        <meta name="author" content="Lukas Erhard">
        <link rel="stylesheet" href="{% static 'dist/main.css' %}" type="text/css">
        <script src="{% static 'dist/main.js' %}"></script>
        <title>AnnotationTool</title>
    </head>
    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        <header>
            {% include "navbar.html" %}
        </header>
        <main>
            <div class="container">
                {% block content %}
                {% endblock content %}
            </div>
        </main>
    </body>
</html>
