<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AnnotationTool</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="keywords"
              content="annotation label labeling text collaborative" />
        <meta name="description" content="Text Annotation Tool">
        <meta name="author" content="Lukas Erhard">
        <link rel="stylesheet" href="{% static 'main.css' %}" type="text/css">
        <script src="{% static 'main.js' %}"></script>
    </head>
    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        <header>
            {% include "navbar.html" %}
        </header>
        <main>
            <div class="container">
                {% block content %}
                {% endblock content %}
            </div>
        </main>
        <div data-toast-container
             class="toast-container position-fixed top-0 start-50 translate-middle-x p-2">
            <div data-toast-template
                 class="toast align-items-center border-0"
                 role="alert"
                 aria-live="assertive"
                 aria-atomic="true">
                <div class="d-flex">
                    <div data-toast-body class="toast-body"></div>
                    <button type="button"
                            class="btn-close btn-close-white me-2 m-auto"
                            data-bs-dismiss="toast"
                            aria-label="Close"></button>
                </div>
            </div>
            {% for message in messages %}
                <div class="toast align-items-center border-0 {{ message.tags }}"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true">
                    <div class="d-flex">
                        <div data-toast-body class="toast-body">{{ message.message }}</div>
                        <button type="button"
                                class="btn-close btn-close-white me-2 m-auto"
                                data-bs-dismiss="toast"
                                aria-label="Close"></button>
                    </div>
                </div>
            {% endfor %}
            <div id="toasta" class="toast align-items-center border-0 bg-success"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true">
                    <div class="d-flex">
                        <div data-toast-body class="toast-body"></div>
                        <button type="button"
                                class="btn-close btn-close-white me-2 m-auto"
                                data-bs-dismiss="toast"
                                aria-label="Close"></button>
                    </div>
                </div>
        </div>
    </body>
</html>
