{% extends "base.html" %}
{% block content %}
<div class="mt-4">
  <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-md">
    <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-lg font-semibold">
        Project:
        {{ object.project }}
      </h2>
    </div>
    <div class="p-4">
      <c-codebook.view content="{{ codebook.content }}" />
    </div>
  </div>
</div>
{% if role == "E" %}
<div class="flex mt-2">
  <a
    href="{% url 'codebook-edit' codebook_id=codebook.pk %}"
    role="button"
    class="cursor-pointer inline-flex items-center rounded-md border border-transparent bg-indigo-600 hover:bg-indigo-500 dark:hover:bg-indigo-700 px-4 py-2 text-sm font-medium text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
    >Edit</a
  >
</div>
{% endif %}
{% endblock content %}
