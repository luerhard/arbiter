{% extends "base.html" %}
{% block content %}
    <div class="row mt-3 text-gray-900 dark:text-gray-100">
        <div class="col">
            <div class="card">
                <div class="card-header">Test: {{ object.pk }}</div>
                <div class="card-body codebook-view">{% include "codebook/partials/view-codebook.html" %}</div>
            </div>
        </div>
    </div>
    {% if role == "E" %}
        <div class="d-flex mt-2">
            <a href="{% url 'codebook-edit' codebook_id=codebook.pk %}"
               role="button"
               class="btn btn-primary">Edit</a>
        </div>
    {% endif %}
{% endblock content %}
