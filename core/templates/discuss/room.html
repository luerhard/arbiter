{% extends "base.html" %}
{% block content %}
    <div class="container-fluid">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">BATCH ID: {{ batch_id }}</h5>
                <div hx-ext="ws" ws-connect="/ws/chat">
                    <form ws-send>
                        <input class="form-control" autocomplete="off" name="message">
                        <input class="btn btn-outline-primary" type="submit">
                    </form>
                </div>
                <div id="messages"></div>
            </div>
        </div>
    </div>
{% endblock content %}
