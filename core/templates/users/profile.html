{% extends "base.html" %}
{% block title %}
Profile · Arbiter
{% endblock title %}
{% block content %}
<div class="mx-auto flex max-w-3xl flex-col gap-7">
  <header class="flex items-center gap-4">
    <c-avatar :name="user.username" size="size-14 text-lg" />
    <div class="flex flex-col gap-0.5">
      <h1 class="page-title">{{ user.username }}</h1>
      <p class="page-subtitle">
        Your account · user ID <span class="font-mono">{{ user.id }}</span>
      </p>
    </div>
  </header>

  <form method="post" class="card flex flex-col gap-5 p-6">
    {% csrf_token %}
    <input type="hidden" name="form" value="profile" />
    <h2 class="card-title">Profile</h2>
    <div class="grid grid-cols-1 gap-5 @xl:grid-cols-2">
      <c-field :field="profile_form.first_name" />
      <c-field :field="profile_form.last_name" />
    </div>
    <c-field :field="profile_form.email" />
    <div class="flex justify-end">
      <button type="submit" class="btn btn-primary">Save profile</button>
    </div>
  </form>

  <form method="post" class="card flex flex-col gap-5 p-6">
    {% csrf_token %}
    <input type="hidden" name="form" value="password" />
    <h2 class="card-title">Password</h2>
    <c-field :field="password_form.old_password" />
    <c-field :field="password_form.new_password1" :help="password_form.new_password1.help_text" />
    <c-field :field="password_form.new_password2" />
    <div class="flex justify-end">
      <button type="submit" class="btn btn-primary">Change password</button>
    </div>
  </form>
</div>
{% endblock content %}
