<aside
  id="codebook-panel"
  aria-label="Codebook"
  class="sticky top-topbar flex h-[calc(100dvh-var(--spacing-topbar))] w-[500px] shrink-0 flex-col border-l border-line bg-surface"
>
  <div class="flex items-center justify-between gap-3 border-b border-line px-5 py-3">
    <div class="flex items-center gap-3">
      <h2 class="card-title">Codebook</h2>
      {% if draft_has_changes %}
      <span class="badge badge-warning">
        <span class="size-1.5 rounded-full bg-current"></span>
        Uncommitted draft
      </span>
      {% endif %}
    </div>
    {% if panel_mode != "edit" %}
    <div class="flex items-center gap-1.5">
      {% if draft %}
      <button
        type="button"
        id="draft-undo-button"
        hx-post="{% url 'expert-draft-delete' batch_id assignment.id %}"
        hx-confirm="Discard your codebook draft and restore the committed version?"
        hx-target="#codebook-panel"
        hx-swap="outerHTML"
        class="btn btn-ghost btn-sm text-danger hover:text-danger"
      >
        Discard draft
      </button>
      {% endif %}
      <button
        type="button"
        id="edit-button"
        hx-get="{% url 'expert-codebook-panel' batch_id assignment.id %}?mode=edit"
        hx-target="#codebook-panel"
        hx-swap="outerHTML"
        class="btn btn-secondary btn-sm"
      >
        {% heroicon_micro "pencil" class="size-4" %}
        {% if draft %}Continue editing{% else %}Edit{% endif %}
      </button>
    </div>
    {% endif %}
  </div>

  {% if panel_mode == "edit" %}
  <div class="flex min-h-0 flex-1 flex-col gap-4 p-5">
    <textarea
      id="codebook-content"
      name="content"
      aria-label="Codebook (Markdown)"
      class="input min-h-0 flex-1 resize-none font-mono text-meta leading-relaxed scrollbar-thin scrollbar-thumb-line-strong"
    >
{{ panel_content }}</textarea>
    <div>
      <label for="rationale" class="field-label"
        >Rationale <span class="font-normal text-ink-3">· saved with the change and shown to annotators</span></label
      >
      <textarea
        id="rationale"
        name="rationale"
        rows="3"
        placeholder="Why does the codebook need this change?"
        class="input"
        {% if rationale_error %}aria-invalid="true"
        aria-describedby="rationale-error"
        autofocus{% endif %}
      >
{{ panel_rationale }}</textarea>
      {% if rationale_error %}
      <p id="rationale-error" class="field-error">{{ rationale_error }}</p>
      {% endif %}
    </div>
    <div class="flex justify-end gap-2.5">
      <button
        type="button"
        id="draft-cancel-button"
        hx-get="{% url 'expert-codebook-panel' batch_id assignment.id %}"
        hx-target="#codebook-panel"
        hx-swap="outerHTML"
        class="btn btn-ghost"
      >
        Cancel
      </button>
      <button
        type="button"
        id="draft-save-button"
        hx-post="{% url 'expert-draft-save' batch_id assignment.id %}"
        hx-include="#codebook-panel"
        hx-target="#codebook-panel"
        hx-swap="outerHTML"
        class="btn btn-primary"
      >
        Save draft
      </button>
    </div>
  </div>
  {% else %}
  <div
    id="codebook-rendered"
    class="flex-1 overflow-y-auto px-6 py-5 text-md scrollbar-thin scrollbar-thumb-line-strong"
  >
    <c-codebook.view content="{{ panel_content }}" />
  </div>
  {% endif %}
</aside>
