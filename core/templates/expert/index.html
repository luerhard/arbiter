{% extends "base.html" %}
{% load markdownify %}
{% load crispy_forms_tags %}
{% block title %}
Resolve Disagreement
{% endblock title %}
{% block content %}
<div
  id="expert-dialog-content"
  hx-ext="alpine-morph"
  hx-get="{% url 'expert-dialogue' batch_id %}"
  hx-trigger="load"
  hx-target="this"
  hx-swap="morph"
></div>
<script>
  document.addEventListener('alpine:init', () => {
    Alpine.store('codebook_modified', false);
  });

  function getDialogElements() {
    return {
      textarea: document.getElementById('codebook-content'),
      rendered: document.getElementById('codebook-rendered'),
      codebookHtml: document.getElementById('codebook-html'),
      editButton: document.getElementById('edit-button'),
      cancelSaveButtons: document.getElementById('cancel-save-buttons'),
      rationaleDiv: document.getElementById('rationale-div'),
    };
  }

  function toggleEdit() {
    const { textarea, rendered, editButton, cancelSaveButtons, rationaleDiv } = getDialogElements();
    if (!textarea || !rendered || !editButton || !cancelSaveButtons || !rationaleDiv) return;
    if (!textarea.classList.contains('hidden')) return;

    rendered.classList.add('hidden');
    textarea.classList.remove('hidden');
    textarea.removeAttribute('readonly');

    editButton.classList.add('hidden');
    cancelSaveButtons.classList.remove('hidden');
    rationaleDiv.classList.remove('hidden');
  }

  function toggleUndo() {
    const { textarea, rendered, editButton, cancelSaveButtons, rationaleDiv, codebookHtml } = getDialogElements();
    if (!textarea || !rendered || !editButton || !cancelSaveButtons || !rationaleDiv) return;
    if (textarea.readOnly) return;

    textarea.readOnly = true;
    textarea.classList.add('hidden');
    if (rendered) {
      rendered.classList.remove('hidden');
    }

    editButton.classList.remove('hidden');
    cancelSaveButtons.classList.add('hidden');
    rationaleDiv.classList.add('hidden');
    if (Alpine.store('codebook_modified')) {
      textarea.value = rendered.getAttribute('data-codebook-content') || '';
      codebookHtml.setHTML(lib.expert.sd.makeHtml(textarea.value));
      Alpine.store('codebook_modified', false);
    }
  }

  function toggleSave() {
    // toggleCancel();
    const { textarea, rendered, editButton, cancelSaveButtons, rationaleDiv, codebookHtml } = getDialogElements();
    if (!textarea || !rendered || !editButton || !cancelSaveButtons || !rationaleDiv) return;
    if (textarea.readOnly) return;
    codebookHtml.setHTML(lib.expert.sd.makeHtml(textarea.value));
    textarea.readOnly = true;
    textarea.classList.add('hidden');
    if (rendered) {
      rendered.classList.remove('hidden');
    }

    editButton.classList.remove('hidden');
    cancelSaveButtons.classList.add('hidden');
    rationaleDiv.classList.add('hidden');
  }
</script>
{% endblock content %}
