{% extends "base.html" %}
{% load static %}
{% block content %}
    <div class="container py-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">BATCH ID: {{ batch_id }}</h5>
                <div class="d-flex">
                    N Online:
                    <div id="n-online-status"></div>
                </div>
                <div class="mt-1" hx-ext="ws" ws-connect="/ws/chat/{{ batch_id }}">
                    <div class="row align-items-center">
                        <div class="col">
                            <div id="current-example">Waiting for others to arrive...</div>
                            <hr class="mt-3 mb-1" />
                            <div id="prev-labels"></div>
                            <hr class="mt-3 mb-1" />
                            <div id="current-labels"></div>
                            <div class="d-flex float-end mt-3">
                                <input type="checkbox"
                                       class="btn-check"
                                       id="save-done"
                                       name="clicked-done"
                                       value="done"
                                       hx-vals="js:{'labels': lib.discuss.collectLabels()}"
                                       ws-send>
                                <label for="save-done" class="btn btn-outline-primary">Save & Done</label>
                            </div>
                        </div>
                        <div class="col mb-2">
                            <div id="messages" class="chat-message-container"></div>
                            {% comment %} send button and htmx logic {% endcomment %}
                            <form class="form" ws-send>
                                <input id="message-input" autocomplete="off" name="message">
                                <input class="btn btn-outline-primary mt-1 float-end"
                                       value="Send"
                                       type="submit">
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function close_room(data) {
            window.location = data["done"];
        }
        // handle everything after receiving data
        document.body.addEventListener('htmx:wsAfterMessage', function(event) {
            // parse JSON data to object
            const data = JSON.parse(event.detail.message); // Event detail contains the message data
            console.log("WebSocket Message Received: ", data);

            // autoscroll down the chat on when new messages arrive
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;

            if ("done" in data) {
                const intervalID = setInterval(close_room, 60000, data);
                console.log(intervalID);
            }

            // handle incoming websocket messages
            if ("update-example" in data) {
                console.log("updating example");
                lib.discuss.updateExample(data);
            }

            if ("update-labels" in data) {
                console.log("updating prev labels");
                lib.discuss.updatePrevLabels(data);
                console.log("updating current labels");
                lib.discuss.updateCurrentLabels(data);
                console.log("unlock save button");
                lib.discuss.unlockSaveDone();
            }
            document.querySelectorAll('.btn-custom-color').forEach(button => {
                const color = getComputedStyle(button).getPropertyValue('--label-color').trim();
                const textColor = lib.funcs.inferTextColorByContrast(color)
                button.style.setProperty("--text-color", textColor);
            });
        })

        // handle everything after sending data
        document.body.addEventListener('htmx:wsAfterSend', function(event) {
            const data = JSON.parse(event.detail.message); // Event detail contains the message data
            console.log("triggered aftersend");

            // Clear Chat text-input after message is sent or Save & Done.
            const inputField = document.getElementById('message-input');
            if (inputField) {
                inputField.value = ''; // Clear the input field
            }

            if ("clicked-done" in data) {
                console.log("lock fields");
                lib.discuss.lockButtons();
            }
        });
    </script>
{% endblock content %}
