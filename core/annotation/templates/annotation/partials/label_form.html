{% load custom_tags %}
{% load widget_tweaks %}
<div id="labels" hx-swap-oob="innerHTML:#labels">
    <form id="label-form"
          hx-post="{% url 'annotate-edit' assignment_id=assignment.id %}"
          hx-target="#save-btn"
          class="mt-5"
          method="post">
        {% csrf_token %}
        <div class="d-flex btn-group" role="group">
            {% for checkbox, detail in label_form.labels|zip_lists:label_form.label_details %}
                <input type="checkbox" name="labels" class="btn-check btn-check-color" id={{ checkbox.id_for_label }} value="{{ checkbox.data.value }}" autocomplete="off" {% if checkbox.data.value in label_form.labels.value %}checked{% endif %} data-hotkey="{{ detail.hotkey }}" />
                <label for="{{ checkbox.id_for_label }}"
                       class="btn btn-custom-color"
                       style="--label-color: {{ detail.color }}">
                    {{ checkbox.choice_label }}
                    {% if detail.hotkey %}({{ detail.hotkey }}){% endif %}
                </label>
            {% endfor %}
        </div>
    </form>
</div>
<script>
    document.querySelectorAll('.btn-custom-color').forEach(button => {
        const color = getComputedStyle(button).getPropertyValue('--label-color').trim();
        const textColor = lib.funcs.inferTextColorByContrast(color)
        button.style.setProperty("--text-color", textColor);
    });
</script>
