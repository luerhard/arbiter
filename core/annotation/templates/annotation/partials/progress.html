<div id="progress-bar-container"
     hx-swap-oob="innerHTML:#progress-bar-container">
    <div class="progress mb-4"
         role="progressbar"
         aria-label="Example with label"
         aria-valuenow="{{ progress }}"
         aria-valuemin="0"
         aria-valuemax="100">
        <div class="progress-bar" style="width: {{ progress.current }}%">{{ progress.done }} / {{ progress.total }}</div>
    </div>
</div>
