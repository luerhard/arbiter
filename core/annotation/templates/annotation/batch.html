{% extends "base.html" %}
{% load widget_tweaks %}
{% block title %}
    Annotate Sentence
{% endblock title %}
{% block content %}
    {% comment %} <script>
     function uncheckSave() {
         var btn = document.getElementById("save-btn");
         btn.innerHTML = "Save <i class='bi bi-floppy'></i>";
         btn.classList.replace("btn-primary", "btn-outline-primary")
     }
 </script> {% endcomment %}
    <div class="container mt-5">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title text-center pb-5">Annotate Sentence</h2>
                    <div id="progress-bar-container"></div>
                    <div class="card">
                        <div class="card-body" id="sentence"></div>
                    </div>
                    <div class="container">
                        <div id="labels"></div>
                    </div>
                    <div class="container text-center">
                        <div id="buttons" class="mt-5 btn-group" role="group"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div hx-get="{% url 'annotate-batch' batch_id=batch.id assignment_id=assignment.id %}"
         hx-trigger="load"></div>
    <script>
        document.addEventListener("htmx:afterOnLoad", function() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(function(checkbox) {
                const hotkey = checkbox.getAttribute('data-hotkey'); // Get custom hotkey from data attribute
                if (hotkey) {
                    Mousetrap.bind(hotkey, function() {
                        checkbox.checked = !checkbox.checked; // Toggle the checkbox on key press
                    });
                }
            });
            const saveBtn = document.getElementById("save-btn");
            if (saveBtn) {
                Mousetrap.bind("enter", function() {
                    saveBtn.click();
                });
            }
        });
    </script>
{% endblock content %}
