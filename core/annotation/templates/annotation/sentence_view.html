{% extends "base.html" %}
{% block title %}
    Annotate Sentence
{% endblock title %}
{% block content %}
    <script>
        function uncheckSave() {
            var btn = document.getElementById("save-btn");
            btn.innerHTML = "Save <i class='bi bi-floppy'></i>";
            btn.classList.replace("btn-primary", "btn-outline-primary")
        }

        document.addEventListener("keypress", function onPress(event) {
            console.log("keypress");
            var label = document.getElementById(event.key);

            if (label !== null) {
                console.log("Triggering " + label.checked, )
                label.checked = !label.checked;
                uncheckSave();
                event.preventDefault();
            }
        });
    </script>
    <div class="container-fluid">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center pb-5">Annotate Sentence</h2>
                <div class="card">
                    <div class="card-body" id="sentence"></div>
                </div>
                <div class="container">
                    <div id="labels"></div>
                </div>
                <div class="container text-center">
                    <div id="buttons" class="mt-5 btn-group" role="group"></div>
                </div>
            </div>
        </div>
    </div>
    <div hx-get="{% url 'annotate-batch' project_id=project_id batch_number=batch_number %}?sentence={{ sent_obj.page_number }}"
         hx-trigger="load"></div>
{% endblock content %}
