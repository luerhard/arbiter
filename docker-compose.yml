services:
  web:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      - DJANOG_DEBUG=1
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    volumes:
      - .:/app # hot-reload + editable
      - media:/app/media
    ports:
      - "8000:8000" # app
      - "5678:5678" # debugpy
    depends_on:
      - db
      - redis
      - vite

  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # prevent overwriting node_modules
    ports:
      - "5173:5173" # vite dev server
    environment:
      - NODE_ENV=development

  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  media:
  pgdata:
  node_modules:
